<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS Gift Sequence Loop</title>
  <style>
    :root {
      --duration: 150s;
      --overlap: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
    }

    .loop-window {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      contain: layout paint;
    }

    .loop-track {
      width: 100%;
      animation: scroll-up var(--duration) linear infinite;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
    }

    .sequence {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .sequence img {
      display: block;
      width: 100%;
      height: auto;
      flex: 0 0 auto;
      margin-top: calc(var(--overlap) * -1);
      border: 0;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      image-rendering: auto;
    }

    .sequence:first-child img:first-child {
      margin-top: 0;
    }

    @keyframes scroll-up {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(0, -50%, 0);
      }
    }
  </style>
</head>
<body>
  <main class="loop-window" aria-label="OBS 텍스트 이미지 무한 스크롤">
    <div class="loop-track">
      <div class="sequence">
        <img src="text_image_001.png" alt="">
        <img src="text_image_002.png" alt="">
        <img src="text_image_003.png" alt="">
        <img src="text_image_004.png" alt="">
        <img src="text_image_005.png" alt="">
        <img src="text_image_006.png" alt="">
        <img src="text_image_007.png" alt="">
        <img src="text_image_008.png" alt="">
      </div>
      <div class="sequence" aria-hidden="true">
        <img src="text_image_001.png" alt="">
        <img src="text_image_002.png" alt="">
        <img src="text_image_003.png" alt="">
        <img src="text_image_004.png" alt="">
        <img src="text_image_005.png" alt="">
        <img src="text_image_006.png" alt="">
        <img src="text_image_007.png" alt="">
        <img src="text_image_008.png" alt="">
      </div>
    </div>
  </main>
</body>
</html>
