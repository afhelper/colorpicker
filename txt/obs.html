<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS Gift Sequence Loop</title>
  <style>
    :root {
      --duration: 232.70s;
      --image-overlap: -10px;
      --scroll-speed: 100;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
    }

    .loop-window {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      contain: layout paint;
    }

    .loop-track {
      width: 100%;
      visibility: hidden;
      animation: scroll-up var(--duration) linear infinite;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
    }

    .sequence {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .sequence img {
      display: block;
      width: 100%;
      height: auto;
      flex: 0 0 auto;
      border: 0;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      image-rendering: auto;
    }

    .sequence img + img {
      margin-top: var(--image-overlap);
    }

    @keyframes scroll-up {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(0, -50%, 0);
      }
    }
  </style>
</head>
<body>
  <main class="loop-window" aria-label="OBS 텍스트 이미지 무한 스크롤">
    <div class="loop-track" id="loopTrack">
    </div>
  </main>
  <script>
    const IMAGE_PREFIX = "text_image_";
    const IMAGE_EXTENSION = ".png";
    const MAX_INDEX = 9999;
    const MAX_CONSECUTIVE_MISSES = 24;

    const loopTrack = document.getElementById("loopTrack");
    const scrollSpeed = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue("--scroll-speed")
    );

    function imagePath(index) {
      return `${IMAGE_PREFIX}${String(index).padStart(3, "0")}${IMAGE_EXTENSION}`;
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.alt = "";
        img.decoding = "async";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function findImages() {
      const images = [];
      let misses = 0;

      for (let index = 1; index <= MAX_INDEX && misses < MAX_CONSECUTIVE_MISSES; index += 1) {
        const img = await loadImage(imagePath(index));

        if (img) {
          images.push(img);
          misses = 0;
        } else {
          misses += 1;
        }
      }

      return images;
    }

    function createSequence(images, isClone = false) {
      const sequence = document.createElement("div");
      sequence.className = "sequence";

      if (isClone) {
        sequence.setAttribute("aria-hidden", "true");
      }

      for (const image of images) {
        const img = image.cloneNode();
        sequence.appendChild(img);
      }

      return sequence;
    }

    function updateDuration() {
      const firstSequence = loopTrack.querySelector(".sequence");

      if (!firstSequence || !scrollSpeed) {
        return;
      }

      const duration = firstSequence.getBoundingClientRect().height / scrollSpeed;
      document.documentElement.style.setProperty("--duration", `${duration.toFixed(2)}s`);
    }

    async function boot() {
      const images = await findImages();

      if (images.length === 0) {
        return;
      }

      loopTrack.appendChild(createSequence(images));
      loopTrack.appendChild(createSequence(images, true));
      updateDuration();
      loopTrack.style.visibility = "visible";
    }

    window.addEventListener("resize", updateDuration);
    boot();
  </script>
</body>
</html>
