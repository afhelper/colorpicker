<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>벽지 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 font-sans text-gray-800 flex flex-col items-center py-10">
    <img src="https://ogqmarket.img.sooplive.co.kr/sticker/60967547df29f/3.png" alt="gif" width="120px">
    <h1 class="text-4xl font-bold text-blue-600 mb-6">벽지 생성기.gif</h1>
    <form id="imageForm" class="bg-white p-6 rounded-lg shadow-md max-w-sm w-full">
        <div class="mb-4">
            <label for="nickname" class="block text-sm font-medium text-gray-700">닉네임:</label>
            <input type="text" id="nickname" name="nickname" required
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-6">
            <label for="donation" class="block text-sm font-medium text-gray-700">캐시:</label>
            <input type="number" id="donation" name="donation" min="0" step="1" required
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">이미지
            생성</button>
    </form>

    <h2 class="text-xl font-semibold text-gray-800 mt-10">생성된 이미지</h2>
    <canvas id="resultCanvas" width="187" height="155" class="border border-gray-300 mt-4"></canvas>
    <br>
    <a id="downloadLink" href="#" download="generated_image.png"
        class="mt-4 inline-block rounded-lg bg-green-600 px-4 py-2 text-white shadow-sm hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500"
        style="display:none;">이미지 다운로드</a>

    <script>
        const form = document.getElementById('imageForm');
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');
        const downloadLink = document.getElementById('downloadLink');

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const nickname = document.getElementById('nickname').value;
            const donation = document.getElementById('donation').value;

            // 캔버스 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 배경 이미지 설정
            const backgroundImage = new Image();
            backgroundImage.src = 'cash.png';
            backgroundImage.onload = () => {
                ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
                drawText(nickname, donation);
                activateDownload();
            };

            backgroundImage.onerror = () => {
                console.error('배경 이미지를 로드할 수 없습니다.');
                drawText(nickname, donation); // 텍스트만 표시
                activateDownload();
            };
        });

        function drawText(nickname, donation) {
            // 닉네임 텍스트
            ctx.font = '13px Arial';
            ctx.fillStyle = '#d65648';
            ctx.textAlign = 'center';
            ctx.fillText(nickname, canvas.width / 2, canvas.height - 22);

            const formattedDonation = Number(donation).toLocaleString('ko-KR');

            // 캐시 텍스트 (캔버스 하단에 검정색으로 표시)
            ctx.font = 'bold 13px Arial';
            ctx.fillStyle = 'black';
            ctx.fillText(`${formattedDonation} 캐시`, canvas.width / 2, canvas.height - 7);

            // 캐시 숫자 텍스트 (상단 40px 위치, 크기 40px, 두 겹 테두리 추가)
            ctx.font = 'bold 40px Arial';

            // 바깥쪽 검정색 테두리
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 8;
            ctx.strokeText(formattedDonation, canvas.width / 2, 40);

            // 안쪽 흰색 테두리
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 6;
            ctx.strokeText(formattedDonation, canvas.width / 2, 40);

            // 빨간색 텍스트
            ctx.fillStyle = 'red';
            ctx.fillText(formattedDonation, canvas.width / 2, 40);
        }

        function activateDownload() {
            downloadLink.style.display = 'inline-block';
            downloadLink.href = canvas.toDataURL('image/png');
        }
    </script>
</body>

</html>
